{% extends "layout.html" %}


{% block content %}

    <h1>Weather</h1>
    <div class="flex flex-col xl:flex-row gap-4 xl:gap-10" hx-get="/v1/weather/" hx-trigger="load" hx-swap="innerHTML">
        <div class="h-[180px] xl:h-auto xl:grow-1 flex flex-col justify-end rounded-2xl p-4 min-w-[324px]">
            <div class="flex w-full flex-col gap-4">
                <div class="skeleton h-10"></div>
                <div class="skeleton h-10"></div>
            </div>
        </div>
        <div class="card gb-base-100 w-full xl:w-[660px] h-[400px] shadow-lg min-w-0">
            <div class="card-body">
                <div class="flex w-full flex-col gap-4">
                    <div class="skeleton h-10"></div>
                    <div class="skeleton h-10"></div>
                    <div class="skeleton h-10"></div>
                    <div class="skeleton h-10"></div>
                    <div class="skeleton h-10"></div>
                    <div class="skeleton h-10"></div>
                    <div class="skeleton h-10"></div>
                </div>
            </div>
        </div>
    </div>

    <h1 class="mt-10">Overview</h1>
    <div hx-get="/v1/home/summary-cards"
         hx-trigger="load, profileSelected from:body, wateringDemandChanged from:body, valveStateChanged from:body"
         hx-swap="innerHTML">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="card bg-base-100 shadow-lg">
                <div class="card-body p-5">
                    <div class="skeleton h-6 w-2/3"></div>
                    <div class="skeleton h-4 w-1/3 mt-2"></div>
                </div>
            </div>
            <div class="card bg-base-100 shadow-lg">
                <div class="card-body p-5">
                    <div class="skeleton h-6 w-2/3"></div>
                    <div class="skeleton h-4 w-1/3 mt-2"></div>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
